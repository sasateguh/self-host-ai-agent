<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" width="980" height="510" role="img" aria-label="Apa yang anda bina dengan panduan ini" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Apa yang anda bina dengan panduan ini</title>
<defs><marker id="hujung" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker></defs>
<rect width="980" height="510" rx="14" fill="#ffffff"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2328">Apa yang anda bina dengan panduan ini</text>
<rect x="32" y="96" width="196" height="64" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="46" y="122" font-size="16" font-weight="600" fill="#1f2328">Anda</text>
<text x="46" y="143" font-size="13" fill="#59636e">Telegram di telefon</text>
<rect x="32" y="262" width="196" height="64" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="46" y="288" font-size="16" font-weight="600" fill="#1f2328">Telegram</text>
<text x="46" y="309" font-size="13" fill="#59636e">API bot</text>
<line x1="130" y1="160" x2="130" y2="260" stroke="#0969da" stroke-width="2" marker-end="url(#hujung)"/>
<rect x="752" y="262" width="196" height="64" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="766" y="288" font-size="16" font-weight="600" fill="#1f2328">Penyedia model</text>
<text x="766" y="309" font-size="13" fill="#59636e">API serasi OpenAI</text>
<rect x="268" y="76" width="452" height="400" rx="14" fill="#eef6ff" stroke="#4f8fd6" stroke-width="2" stroke-dasharray="6 5"/>
<text x="288" y="104" font-size="15" font-weight="700" fill="#0969da">VPS anda · Ubuntu 24.04</text>
<rect x="288" y="120" width="412" height="62" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="302" y="146" font-size="16" font-weight="600" fill="#1f2328">Firewall</text>
<text x="302" y="167" font-size="13" fill="#59636e">masuk: SSH (kunci sahaja) + HTTPS</text>
<text x="688" y="146" font-size="12" text-anchor="end" fill="#8250df">bab 2–3, 5</text>
<rect x="288" y="262" width="412" height="64" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/>
<text x="302" y="288" font-size="16" font-weight="600" fill="#1f2328">Ejen AI</text>
<text x="302" y="309" font-size="13" fill="#59636e">bekas Docker, mendengar pada 127.0.0.1 sahaja</text>
<text x="688" y="288" font-size="12" text-anchor="end" fill="#8250df">bab 4 + ejen</text>
<rect x="288" y="352" width="132" height="104" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="302" y="378" font-size="16" font-weight="600" fill="#1f2328">Kunci API</text>
<text x="302" y="398" font-size="12" fill="#8250df">bab 8</text>
<text x="302" y="420" font-size="13" fill="#59636e">fail root sahaja</text>
<rect x="428" y="352" width="132" height="104" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="442" y="378" font-size="16" font-weight="600" fill="#1f2328">Backup</text>
<text x="442" y="398" font-size="12" fill="#8250df">bab 6</text>
<text x="442" y="420" font-size="13" fill="#59636e">pemulihan diuji</text>
<rect x="568" y="352" width="132" height="104" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="582" y="378" font-size="16" font-weight="600" fill="#1f2328">Pemantauan</text>
<text x="582" y="398" font-size="12" fill="#8250df">bab 7, 9</text>
<text x="582" y="420" font-size="13" fill="#59636e">amaran Telegram</text>
<line x1="288" y1="294" x2="230" y2="294" stroke="#0969da" stroke-width="2" marker-end="url(#hujung)"/>
<text x="130" y="348" font-size="12" text-anchor="middle" fill="#59636e">ejen mengambil mesej</text>
<line x1="700" y1="294" x2="750" y2="294" stroke="#0969da" stroke-width="2" marker-end="url(#hujung)"/>
<text x="850" y="348" font-size="12" text-anchor="middle" fill="#59636e">ejen memanggil model</text>
<text x="32" y="492" font-size="13" fill="#59636e">Ejen hanya membuat sambungan keluar. Dari internet, hanya SSH dan HTTPS menjawab.</text>
</svg>
